# Common Docker Compose file for Team 19 (Student ID, Please).
#
# Points only at images already pushed to DockerHub - never at local Dockerfiles - per the CPR's
# Lab 1 requirement. Currently wires up the services owned by Diana (server-rules-service,
# university-record-service) and Andi (moderation-service, discord-dms-service); other members
# should append their own service + database blocks here following the same pattern as their
# services come online.
#
# Usage:
#   cp .env.example .env   # fill in real values - .env is gitignored, never commit it
#   docker compose up

services:
  server-rules-service:
    image: diana7376/server-rules-service:0.2.0
    ports:
      - "8085:8085"
    environment:
      MONGODB_URI: mongodb://${RULES_MONGO_USERNAME}:${RULES_MONGO_PASSWORD}@rules-mongo:27017/server_rules?authSource=admin
    depends_on:
      - rules-mongo

  rules-mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${RULES_MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${RULES_MONGO_PASSWORD}
    volumes:
      - rules-mongo-data:/data/db

  university-record-service:
    image: diana7376/university-record-service:0.2.0
    ports:
      - "8086:8086"
    environment:
      DB_URL: jdbc:postgresql://record-postgres:5432/university_record
      DB_USERNAME: ${RECORD_POSTGRES_USER}
      DB_PASSWORD: ${RECORD_POSTGRES_PASSWORD}
    depends_on:
      - record-postgres

  record-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: university_record
      POSTGRES_USER: ${RECORD_POSTGRES_USER}
      POSTGRES_PASSWORD: ${RECORD_POSTGRES_PASSWORD}
    volumes:
      - record-postgres-data:/var/lib/postgresql/data

  moderation-service:
    image: blinduandi/moderation-service:0.2.0
    ports:
      - "8087:8087"
    environment:
      ConnectionStrings__Moderation: Host=moderation-postgres;Port=5432;Database=moderation;Username=${MODERATION_POSTGRES_USER};Password=${MODERATION_POSTGRES_PASSWORD}
      Downstream__Rules__Mode: Http
      Downstream__Rules__BaseUrl: http://server-rules-service:8085
      Downstream__Records__Mode: Http
      Downstream__Records__BaseUrl: http://university-record-service:8086
      # credential-service has no published image yet, so its answers are mocked.
      Downstream__Credential__Mode: Mock
    depends_on:
      moderation-postgres:
        condition: service_healthy
      server-rules-service:
        condition: service_started
      university-record-service:
        condition: service_started

  moderation-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: moderation
      POSTGRES_USER: ${MODERATION_POSTGRES_USER}
      POSTGRES_PASSWORD: ${MODERATION_POSTGRES_PASSWORD}
    volumes:
      - moderation-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  discord-dms-service:
    image: blinduandi/discord-dms-service:0.2.0
    ports:
      - "8088:8088"
    environment:
      ConnectionStrings__Redis: dms-redis:6379,password=${DMS_REDIS_PASSWORD}
    depends_on:
      dms-redis:
        condition: service_healthy

  dms-redis:
    image: redis:7.4-alpine
    # The password is expanded when the container starts, so it is not part of the container
    # command. redis-cli reads REDISCLI_AUTH as well, which is how the healthcheck authenticates.
    command: ["sh", "-c", "exec docker-entrypoint.sh redis-server --requirepass \"$$REDISCLI_AUTH\" --appendonly yes"]
    environment:
      REDISCLI_AUTH: ${DMS_REDIS_PASSWORD}
    volumes:
      - dms-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  rules-mongo-data:
  record-postgres-data:
  moderation-postgres-data:
  dms-redis-data:
