# Common Docker Compose file for Team 19 (Student ID, Please).
#
# Points only at images already pushed to DockerHub - never at local Dockerfiles - per the CPR's
# Lab 1 requirement. Wires up all 8 services: server-rules-service/university-record-service
# (Diana), applicant-service/credential-service (Mihai), moderation-service/discord-dms-service
# (Andi), player-service/server-moderation-session-service (Daria), plus gateway-service, the
# single entry point on port 8080 (Lab 2). Clients need an API key there (GATEWAY_API_KEYS in .env,
# sent as "Authorization: Bearer <key>"); the services call each other through the gateway's
# internal port 8090, which is not published to the host. Lab 4 adds message-broker: player-service
# and server-moderation-session-service take their events from it and session publishes its own to
# it, over gRPC on the private Compose network (CPR docs/MESSAGE_BROKER_CONTRACT.md). Lab 5 replicates
# player-postgres, session-postgres, record-postgres and moderation-postgres: three Patroni members
# each (image drateeva/postgres-ha, built from docker/postgres-ha/), an etcd cluster that elects the
# primary, and an HAProxy under the old hostname that always leads to the primary
# (docs/LAB_5_DATABASE_FAILOVER.md). dms-redis becomes a primary, two replicas and three Sentinels
# (docker/redis-ha/, docs/LAB_5_MODERATION_DMS_FAILOVER.md), rules-mongo a three-member replica
# set. The gateway coordinates the decision-verdict saga across moderation-service and
# discord-dms-service (docs/LAB_5_SAGA.md).
#
# Usage:
#   cp .env.example .env   # fill in real values - .env is gitignored, never commit it
#   docker compose up

# Shared settings of the replicated PostgreSQL clusters (Lab 5, Grade 5), reused below with <<.
x-postgres-ha-member: &postgres-ha-member
  image: drateeva/postgres-ha:16.16-patroni4.1.5
  # Each member also mounts docker/postgres-ha/patroni.yml over the image's copy (below), so a change
  # to it (Lab 5, Grade 8: max_prepared_transactions) needs no new image.
  healthcheck:
    # Patroni's REST API: 200 once PostgreSQL runs as the primary or as a streaming standby.
    test: ["CMD-SHELL", "curl -fsS http://localhost:8008/readiness >/dev/null || exit 1"]
    interval: 5s
    timeout: 3s
    retries: 24
    start_period: 20s
  depends_on:
    postgres-etcd-1:
      condition: service_healthy
    postgres-etcd-2:
      condition: service_healthy
    postgres-etcd-3:
      condition: service_healthy

x-postgres-ha-router: &postgres-ha-router
  image: haproxy:3.0.31-alpine
  volumes:
    - ./docker/postgres-ha/haproxy-postgres.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
  healthcheck:
    # 200 only while one member is the primary, so the service starts once it can write.
    test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8404/healthz || exit 1"]
    interval: 3s
    timeout: 3s
    retries: 40
    start_period: 10s

x-player-postgres-cluster: &player-postgres-cluster
  PATRONI_SCOPE: player-postgres
  PATRONI_ETCD3_HOSTS: postgres-etcd-1:2379,postgres-etcd-2:2379,postgres-etcd-3:2379
  PATRONI_SUPERUSER_PASSWORD: ${PLAYER_POSTGRES_SUPERUSER_PASSWORD}
  PATRONI_REPLICATION_PASSWORD: ${PLAYER_POSTGRES_REPLICATION_PASSWORD}
  APP_DB_NAME: playerdb
  APP_DB_USER: ${PLAYER_POSTGRES_USER}
  APP_DB_PASSWORD: ${PLAYER_POSTGRES_PASSWORD}

x-session-postgres-cluster: &session-postgres-cluster
  PATRONI_SCOPE: session-postgres
  PATRONI_ETCD3_HOSTS: postgres-etcd-1:2379,postgres-etcd-2:2379,postgres-etcd-3:2379
  PATRONI_SUPERUSER_PASSWORD: ${SESSION_POSTGRES_SUPERUSER_PASSWORD}
  PATRONI_REPLICATION_PASSWORD: ${SESSION_POSTGRES_REPLICATION_PASSWORD}
  APP_DB_NAME: sessiondb
  APP_DB_USER: ${SESSION_POSTGRES_USER}
  APP_DB_PASSWORD: ${SESSION_POSTGRES_PASSWORD}

x-record-postgres-cluster: &record-postgres-cluster
  PATRONI_SCOPE: record-postgres
  PATRONI_ETCD3_HOSTS: postgres-etcd-1:2379,postgres-etcd-2:2379,postgres-etcd-3:2379
  PATRONI_SUPERUSER_PASSWORD: ${RECORD_POSTGRES_SUPERUSER_PASSWORD}
  PATRONI_REPLICATION_PASSWORD: ${RECORD_POSTGRES_REPLICATION_PASSWORD}
  APP_DB_NAME: university_record
  APP_DB_USER: ${RECORD_POSTGRES_USER}
  APP_DB_PASSWORD: ${RECORD_POSTGRES_PASSWORD}

x-moderation-postgres-cluster: &moderation-postgres-cluster
  PATRONI_SCOPE: moderation-postgres
  PATRONI_ETCD3_HOSTS: postgres-etcd-1:2379,postgres-etcd-2:2379,postgres-etcd-3:2379
  PATRONI_SUPERUSER_PASSWORD: ${MODERATION_POSTGRES_SUPERUSER_PASSWORD}
  PATRONI_REPLICATION_PASSWORD: ${MODERATION_POSTGRES_REPLICATION_PASSWORD}
  APP_DB_NAME: moderation
  APP_DB_USER: ${MODERATION_POSTGRES_USER}
  APP_DB_PASSWORD: ${MODERATION_POSTGRES_PASSWORD}

x-postgres-etcd: &postgres-etcd
  image: quay.io/coreos/etcd:v3.6.17
  healthcheck:
    test: ["CMD", "etcdctl", "endpoint", "health"]
    interval: 5s
    timeout: 3s
    retries: 12

# The replicated Redis of discord-dms-service (Lab 5, Grade 5): dms-redis-1..3 (one primary, two
# replicas), three Sentinels that promote a replica when the primary is lost, and an HAProxy under
# the old hostname dms-redis (docker/redis-ha/, docs/LAB_5_MODERATION_DMS_FAILOVER.md).
x-dms-redis-cluster: &dms-redis-cluster
  REDISCLI_AUTH: ${DMS_REDIS_PASSWORD}
  REDIS_MASTER_NAME: dms-redis
  REDIS_INITIAL_PRIMARY: dms-redis-1
  REDIS_SENTINELS: dms-redis-sentinel-1 dms-redis-sentinel-2 dms-redis-sentinel-3

x-dms-redis-member: &dms-redis-member
  image: redis:7.4-alpine
  # The password and the member's role are set when the container starts (redis-node.sh), so neither
  # is part of the container command. redis-cli reads REDISCLI_AUTH, which is how the healthcheck
  # authenticates.
  entrypoint: ["sh", "/redis-ha/redis-node.sh"]
  healthcheck:
    test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 30s

x-dms-redis-sentinel: &dms-redis-sentinel
  image: redis:7.4-alpine
  entrypoint: ["sh", "/redis-ha/sentinel.sh"]
  healthcheck:
    test: ["CMD-SHELL", "redis-cli -p 26379 ping | grep -q PONG"]
    interval: 5s
    timeout: 3s
    retries: 12
  # Started, not healthy: a member that restarts asks the Sentinels for the primary before it serves,
  # so waiting for the members to be healthy first would only delay both.
  depends_on:
    dms-redis-1:
      condition: service_started
    dms-redis-2:
      condition: service_started
    dms-redis-3:
      condition: service_started

services:
  # Not published to the host: clients reach it only through the gateway (Lab 2). Its own calls to
  # credential-service, server-rules-service and university-record-service also go through the
  # gateway, on the internal port. No depends_on the gateway: the gateway depends on this service,
  # and the calls only happen once a request arrives. Every replica registers with
  # service-discovery under its container hostname, and the gateway finds the replicas there (Lab 3).
  # Lab 5: all replicas share moderation-postgres, the current primary of a replicated cluster; while
  # a failover runs they answer 503 DATABASE_UNAVAILABLE with Retry-After. Participant of the
  # decision-verdict saga (Grade 9, contracts/saga.md) on /internal/sagas/..., called by the gateway.
  moderation-service:
    deploy:
      replicas: ${MODERATION_REPLICAS:-2}
    image: andiblindu1/moderation-service:0.6.0
    environment:
      ServiceDiscovery__Url: http://service-discovery:8089
      ConnectionStrings__Moderation: Host=moderation-postgres;Port=5432;Database=moderation;Username=${MODERATION_POSTGRES_USER};Password=${MODERATION_POSTGRES_PASSWORD}
      Downstream__Rules__Mode: Http
      Downstream__Rules__BaseUrl: http://gateway-service:8090
      Downstream__Records__Mode: Http
      Downstream__Records__BaseUrl: http://gateway-service:8090
      Downstream__Credential__Mode: Http
      Downstream__Credential__BaseUrl: http://gateway-service:8090
      Limits__RequestTimeoutMs: ${MODERATION_REQUEST_TIMEOUT_MS:-8000}
      Limits__MaxConcurrentRequests: ${MODERATION_MAX_CONCURRENT_REQUESTS:-100}
      # Lab 4: ServiceEndpoint on 9087, outbox published with MessageBroker.Publish. The three
      # dependencies stay on Http until credential, rules and records all serve ServiceEndpoint.
      Messaging__Enabled: "true"
      Messaging__HttpPort: "8087"
      Messaging__GrpcPort: "9087"
      Messaging__BrokerUrl: http://message-broker:9091
    # The image has no curl, so the healthcheck sends GET /health through bash's /dev/tcp.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8087 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      service-discovery:
        condition: service_healthy
      moderation-postgres:
        condition: service_healthy

  # moderation-service's database (Lab 5, Grade 5: replication + failover), replicated like
  # player-postgres: three Patroni members (moderation-postgres-1..3: one primary, a synchronous and a
  # streaming standby) in the same etcd cluster, and under the old hostname moderation-postgres an
  # HAProxy that always forwards to the current primary. Lose the primary and a standby is promoted
  # within ~15 s; moderation-service and the ETL job keep the same connection string.
  moderation-postgres:
    <<: *postgres-ha-router
    environment:
      PG_MEMBER_1: moderation-postgres-1
      PG_MEMBER_2: moderation-postgres-2
      PG_MEMBER_3: moderation-postgres-3
    depends_on:
      moderation-postgres-1:
        condition: service_started
      moderation-postgres-2:
        condition: service_started
      moderation-postgres-3:
        condition: service_started

  moderation-postgres-1:
    <<: *postgres-ha-member
    environment:
      <<: *moderation-postgres-cluster
      PATRONI_NAME: moderation-postgres-1
      PATRONI_RESTAPI_CONNECT_ADDRESS: moderation-postgres-1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: moderation-postgres-1:5432
    volumes:
      - moderation-postgres-1-data:/var/lib/postgresql/patroni
      - ./docker/postgres-ha/patroni.yml:/etc/patroni/patroni.yml:ro

  moderation-postgres-2:
    <<: *postgres-ha-member
    environment:
      <<: *moderation-postgres-cluster
      PATRONI_NAME: moderation-postgres-2
      PATRONI_RESTAPI_CONNECT_ADDRESS: moderation-postgres-2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: moderation-postgres-2:5432
    volumes:
      - moderation-postgres-2-data:/var/lib/postgresql/patroni
      - ./docker/postgres-ha/patroni.yml:/etc/patroni/patroni.yml:ro

  moderation-postgres-3:
    <<: *postgres-ha-member
    environment:
      <<: *moderation-postgres-cluster
      PATRONI_NAME: moderation-postgres-3
      PATRONI_RESTAPI_CONNECT_ADDRESS: moderation-postgres-3:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: moderation-postgres-3:5432
    volumes:
      - moderation-postgres-3-data:/var/lib/postgresql/patroni
      - ./docker/postgres-ha/patroni.yml:/etc/patroni/patroni.yml:ro

  # Its REST endpoints are called through the gateway (Lab 2). Port 8088 stays published for the
  # chat WebSocket only: clients open it directly, with the URL that POST /ws/negotiate on the
  # gateway returns. Every instance registers with service-discovery under its container hostname,
  # and the gateway finds the instances there (Lab 3). Lab 5: it asks the Sentinels which member of
  # the replicated dms-redis is the primary and follows a failover on its own; while one runs it
  # answers 503 STORE_UNAVAILABLE with Retry-After. Participant of the decision-verdict saga (Grade 9,
  # contracts/saga.md) on /internal/sagas/..., called by the gateway.
  discord-dms-service:
    image: andiblindu1/discord-dms-service:0.6.0
    ports:
      - "8088:8088"
    environment: &dms-environment
      ServiceDiscovery__Url: http://service-discovery:8089
      # The Sentinels, not a member: serviceName is the name they monitor the primary under.
      ConnectionStrings__Redis: dms-redis-sentinel-1:26379,dms-redis-sentinel-2:26379,dms-redis-sentinel-3:26379,serviceName=dms-redis,password=${DMS_REDIS_PASSWORD},abortConnect=false
      # The gateway's WS_TICKET_SECRET: the chat accepts only the tickets the gateway signs with it.
      Chat__TicketSecret: ${GATEWAY_WS_TICKET_SECRET}
      Limits__RequestTimeoutMs: ${DMS_REQUEST_TIMEOUT_MS:-8000}
      Limits__MaxConcurrentRequests: ${DMS_MAX_CONCURRENT_REQUESTS:-100}
      # Lab 4: ServiceEndpoint on 9088; consumes verdict.issued, session.started, session.closed and
      # ruleset.updated from the broker. The replicas share this block and one queue per topic.
      Messaging__Enabled: "true"
      Messaging__HttpPort: "8088"
      Messaging__GrpcPort: "9088"
      Messaging__BrokerUrl: http://message-broker:9091
    # The image has no curl, so the healthcheck sends GET /health through bash's /dev/tcp.
    healthcheck: &dms-healthcheck
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8088 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on: &dms-depends-on
      service-discovery:
        condition: service_healthy
      dms-redis-sentinel-1:
        condition: service_healthy
      dms-redis-sentinel-2:
        condition: service_healthy
      dms-redis-sentinel-3:
        condition: service_healthy
      # Healthy only while one member is the primary: the service starts once it can write.
      dms-redis:
        condition: service_healthy

  # More instances of discord-dms-service, with the same image and settings. A host port belongs to
  # one container, so only discord-dms-service publishes 8088 for the chat; these publish no port,
  # as the gateway reaches them on the Compose network. Chat messages and session.closed pass
  # between all instances over Redis, so the chats still reach every client.
  discord-dms-service-replica:
    deploy:
      replicas: ${DMS_EXTRA_REPLICAS:-1}
    image: andiblindu1/discord-dms-service:0.6.0
    environment: *dms-environment
    healthcheck: *dms-healthcheck
    depends_on: *dms-depends-on

  # discord-dms-service's Redis (Lab 5, Grade 5: replication + failover). dms-redis-1..3: one primary
  # and two replicas that copy it asynchronously; dms-redis-sentinel-1..3 watch the primary and, when
  # two of them lose it for 5 s, promote a replica (~10 s in all) and turn the old primary into a
  # replica of the new one once it is back. Under the old hostname dms-redis, an HAProxy forwards to
  # the current primary for clients that know one address only (the ETL job). Each member and each
  # Sentinel keeps its configuration on its own volume, so a restart keeps the roles the last
  # failover gave them.
  dms-redis:
    image: haproxy:3.0.31-alpine
    environment:
      REDIS_PASSWORD: ${DMS_REDIS_PASSWORD}
      REDIS_MEMBER_1: dms-redis-1
      REDIS_MEMBER_2: dms-redis-2
      REDIS_MEMBER_3: dms-redis-3
    volumes:
      - ./docker/redis-ha/haproxy-redis.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    healthcheck:
      # 200 only while one member is the primary.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8404/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s
    depends_on:
      dms-redis-1:
        condition: service_started
      dms-redis-2:
        condition: service_started
      dms-redis-3:
        condition: service_started

  dms-redis-1:
    <<: *dms-redis-member
    environment:
      <<: *dms-redis-cluster
      REDIS_NODE_NAME: dms-redis-1
    volumes:
      - dms-redis-1-data:/data
      - ./docker/redis-ha:/redis-ha:ro

  dms-redis-2:
    <<: *dms-redis-member
    environment:
      <<: *dms-redis-cluster
      REDIS_NODE_NAME: dms-redis-2
    volumes:
      - dms-redis-2-data:/data
      - ./docker/redis-ha:/redis-ha:ro

  dms-redis-3:
    <<: *dms-redis-member
    environment:
      <<: *dms-redis-cluster
      REDIS_NODE_NAME: dms-redis-3
    volumes:
      - dms-redis-3-data:/data
      - ./docker/redis-ha:/redis-ha:ro

  dms-redis-sentinel-1:
    <<: *dms-redis-sentinel
    environment:
      <<: *dms-redis-cluster
      REDIS_SENTINEL_NAME: dms-redis-sentinel-1
    volumes:
      - dms-redis-sentinel-1-data:/data
      - ./docker/redis-ha:/redis-ha:ro

  dms-redis-sentinel-2:
    <<: *dms-redis-sentinel
    environment:
      <<: *dms-redis-cluster
      REDIS_SENTINEL_NAME: dms-redis-sentinel-2
    volumes:
      - dms-redis-sentinel-2-data:/data
      - ./docker/redis-ha:/redis-ha:ro

  dms-redis-sentinel-3:
    <<: *dms-redis-sentinel
    environment:
      <<: *dms-redis-cluster
      REDIS_SENTINEL_NAME: dms-redis-sentinel-3
    volumes:
      - dms-redis-sentinel-3-data:/data
      - ./docker/redis-ha:/redis-ha:ro

  server-rules-service:
    deploy:
      replicas: ${RULES_REPLICAS:-2}
    image: diana7376/server-rules-service:0.6.0
    environment:
      MONGODB_URI: mongodb://${RULES_MONGO_USERNAME}:${RULES_MONGO_PASSWORD}@rules-mongo-1:27017,rules-mongo-2:27017,rules-mongo-3:27017/server_rules?authSource=admin&replicaSet=rs0
      MAX_THREADS: ${RULES_MAX_THREADS:-200}
      REQUEST_TIMEOUT_MS: ${RULES_REQUEST_TIMEOUT_MS:-5000}
      SD_URL: http://service-discovery:8089
      BROKER_GRPC_URL: message-broker:9091
    depends_on:
      service-discovery:
        condition: service_healthy
      rules-mongo-1:
        condition: service_started

  # rules-mongo-1..3: 3-member MongoDB replica set "rs0". rules-mongo-1 creates the admin user
  # (MONGO_INITDB_ROOT_*) on first boot; rules-mongo-setup initiates the RS once the primary
  # accepts connections. Spring Data MongoDB on server-rules-service discovers the primary
  # automatically via the RS-aware connection string — no HAProxy needed.
  rules-mongo-1:
    image: mongo:7
    command: mongod --replSet rs0 --bind_ip_all
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${RULES_MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${RULES_MONGO_PASSWORD}
    volumes:
      - rules-mongo-1-data:/data/db

  rules-mongo-2:
    image: mongo:7
    command: mongod --replSet rs0 --bind_ip_all
    volumes:
      - rules-mongo-2-data:/data/db

  rules-mongo-3:
    image: mongo:7
    command: mongod --replSet rs0 --bind_ip_all
    volumes:
      - rules-mongo-3-data:/data/db

  # One-shot init container: waits for rules-mongo-1 to accept connections, then calls
  # rs.initiate(). On subsequent restarts (RS already initiated) the call returns
  # AlreadyInitialized and the container exits 0.
  rules-mongo-setup:
    image: mongo:7
    restart: "no"
    depends_on:
      - rules-mongo-1
      - rules-mongo-2
      - rules-mongo-3
    environment:
      RULES_MONGO_USERNAME: ${RULES_MONGO_USERNAME}
      RULES_MONGO_PASSWORD: ${RULES_MONGO_PASSWORD}
    command: >
      bash -c "
        until mongosh --host rules-mongo-1:27017
          -u $$RULES_MONGO_USERNAME -p $$RULES_MONGO_PASSWORD
          --authenticationDatabase admin
          --eval 'db.adminCommand({ping:1})' --quiet 2>/dev/null; do
          echo 'Waiting for rules-mongo-1...' && sleep 3;
        done &&
        mongosh --host rules-mongo-1:27017
          -u $$RULES_MONGO_USERNAME -p $$RULES_MONGO_PASSWORD
          --authenticationDatabase admin --eval '
            try {
              rs.initiate({_id:\"rs0\",members:[
                {_id:0,host:\"rules-mongo-1:27017\",priority:2},
                {_id:1,host:\"rules-mongo-2:27017\"},
                {_id:2,host:\"rules-mongo-3:27017\"}
              ]});
            } catch(e) {
              if(e.codeName===\"AlreadyInitialized\") print(\"RS already initialized\");
              else throw e;
            }
          '
      "

  university-record-service:
    deploy:
      replicas: ${RECORD_REPLICAS:-2}
    image: diana7376/university-record-service:0.6.0
    environment:
      DB_URL: jdbc:postgresql://record-postgres:5432/university_record
      DB_USERNAME: ${RECORD_POSTGRES_USER}
      DB_PASSWORD: ${RECORD_POSTGRES_PASSWORD}
      MAX_THREADS: ${RECORD_MAX_THREADS:-200}
      REQUEST_TIMEOUT_MS: ${RECORD_REQUEST_TIMEOUT_MS:-5000}
      SD_URL: http://service-discovery:8089
      BROKER_GRPC_URL: message-broker:9091
    depends_on:
      service-discovery:
        condition: service_healthy
      record-postgres:
        condition: service_healthy

  # record-postgres-1..3: Patroni cluster, one primary + two standbys (synchronous + streaming).
  # HAProxy at the old hostname record-postgres always forwards to the current primary. Lose the
  # primary and a standby is promoted within ~15 s; university-record-service keeps the same URL.
  record-postgres:
    <<: *postgres-ha-router
    environment:
      PG_MEMBER_1: record-postgres-1
      PG_MEMBER_2: record-postgres-2
      PG_MEMBER_3: record-postgres-3
    depends_on:
      record-postgres-1:
        condition: service_started
      record-postgres-2:
        condition: service_started
      record-postgres-3:
        condition: service_started

  record-postgres-1:
    <<: *postgres-ha-member
    environment:
      <<: *record-postgres-cluster
      PATRONI_NAME: record-postgres-1
      PATRONI_RESTAPI_CONNECT_ADDRESS: record-postgres-1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: record-postgres-1:5432
    volumes:
      - record-postgres-1-data:/var/lib/postgresql/patroni
      - ./docker/postgres-ha/patroni.yml:/etc/patroni/patroni.yml:ro

  record-postgres-2:
    <<: *postgres-ha-member
    environment:
      <<: *record-postgres-cluster
      PATRONI_NAME: record-postgres-2
      PATRONI_RESTAPI_CONNECT_ADDRESS: record-postgres-2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: record-postgres-2:5432
    volumes:
      - record-postgres-2-data:/var/lib/postgresql/patroni
      - ./docker/postgres-ha/patroni.yml:/etc/patroni/patroni.yml:ro

  record-postgres-3:
    <<: *postgres-ha-member
    environment:
      <<: *record-postgres-cluster
      PATRONI_NAME: record-postgres-3
      PATRONI_RESTAPI_CONNECT_ADDRESS: record-postgres-3:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: record-postgres-3:5432
    volumes:
      - record-postgres-3-data:/var/lib/postgresql/patroni
      - ./docker/postgres-ha/patroni.yml:/etc/patroni/patroni.yml:ro

  applicant-service:
    deploy:
      replicas: ${APPLICANT_REPLICAS:-2}
    image: caramisca/applicant-service:0.5.0
    environment:
      Storage__Provider: Redis
      ServiceDiscovery__Url: http://service-discovery:8089
      Redis__ConnectionString: applicant-redis:6379,password=${APPLICANT_REDIS_PASSWORD},abortConnect=false
      Services__CredentialServiceMode: Http
      Services__CredentialServiceUrl: http://gateway-service:8090
      MAX_THREADS: ${APPLICANT_MAX_THREADS:-200}
      REQUEST_TIMEOUT_MS: ${APPLICANT_REQUEST_TIMEOUT_MS:-5000}
    depends_on:
      service-discovery:
        condition: service_healthy
      applicant-seed:
        condition: service_completed_successfully
      credential-service:
        condition: service_started

  applicant-redis:
    image: redis:7.4-alpine
    # The password is expanded when the container starts, so it is not part of the container
    # command. redis-cli reads REDISCLI_AUTH as well, which is how the healthcheck authenticates.
    command: ["sh", "-c", "exec docker-entrypoint.sh redis-server --requirepass \"$$REDISCLI_AUTH\" --appendonly yes"]
    environment:
      REDISCLI_AUTH: ${APPLICANT_REDIS_PASSWORD}
    volumes:
      - applicant-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot job: loads the demo applicants of docs/db/applicant-service when Redis holds none.
  applicant-seed:
    image: redis:7.4-alpine
    entrypoint: ["sh", "/seed/seed.sh"]
    environment:
      REDIS_HOST: applicant-redis
      REDISCLI_AUTH: ${APPLICANT_REDIS_PASSWORD}
    volumes:
      - ./docs/db/applicant-service:/seed:ro
    depends_on:
      applicant-redis:
        condition: service_healthy
    restart: "no"

  credential-service:
    deploy:
      replicas: ${CREDENTIAL_REPLICAS:-2}
    image: caramisca/credential-service:0.5.0
    environment:
      Storage__Provider: Redis
      ServiceDiscovery__Url: http://service-discovery:8089
      Redis__ConnectionString: credential-redis:6379,password=${CREDENTIAL_REDIS_PASSWORD},abortConnect=false
      Services__UniversityRecordMode: Http
      Services__UniversityRecordServiceUrl: http://gateway-service:8090
      MAX_THREADS: ${CREDENTIAL_MAX_THREADS:-200}
      REQUEST_TIMEOUT_MS: ${CREDENTIAL_REQUEST_TIMEOUT_MS:-5000}
    depends_on:
      service-discovery:
        condition: service_healthy
      credential-seed:
        condition: service_completed_successfully
      university-record-service:
        condition: service_started

  credential-redis:
    image: redis:7.4-alpine
    command: ["sh", "-c", "exec docker-entrypoint.sh redis-server --requirepass \"$$REDISCLI_AUTH\" --appendonly yes"]
    environment:
      REDISCLI_AUTH: ${CREDENTIAL_REDIS_PASSWORD}
    volumes:
      - credential-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot job: loads the demo credential bundles of docs/db/credential-service when Redis holds none.
  credential-seed:
    image: redis:7.4-alpine
    entrypoint: ["sh", "/seed/seed.sh"]
    environment:
      REDIS_HOST: credential-redis
      REDISCLI_AUTH: ${CREDENTIAL_REDIS_PASSWORD}
    volumes:
      - ./docs/db/credential-service:/seed:ro
    depends_on:
      credential-redis:
        condition: service_healthy
    restart: "no"

  # Not published to the host: clients reach it only through the gateway (Lab 2). Every replica
  # registers with service-discovery under its container hostname and its own container address,
  # and the gateway finds the replicas there (Lab 3). All replicas share player-postgres (since Lab 5
  # the current primary of a replicated cluster).
  # Lab 4: each replica serves the broker's gRPC ServiceEndpoint on 9081 (private) and registers the
  # topics decision.evaluated and session.closed, so the broker delivers those events to it.
  player-service:
    deploy:
      replicas: ${PLAYER_REPLICAS:-2}
    image: drateeva/player-service:0.5.0
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://player-postgres:5432/playerdb
      SPRING_DATASOURCE_USERNAME: ${PLAYER_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${PLAYER_POSTGRES_PASSWORD}
      TASK_TIMEOUT: ${PLAYER_TASK_TIMEOUT:-10s}
      MAX_CONCURRENT_TASKS: ${PLAYER_MAX_CONCURRENT_TASKS:-20}
      DISCOVERY_URL: http://service-discovery:8089
      MESSAGING_ENABLED: "true"
      # Lab 5, Grade 8: a participant of the two-phase commit that closes a shift
      # (contracts/two-phase.md); the coordinator is the message-broker.
      TWO_PHASE_PARTICIPANT_ENABLED: "true"
      TWO_PHASE_COORDINATOR_URL: http://message-broker:8091
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      service-discovery:
        condition: service_healthy
      player-postgres:
        condition: service_healthy

  # player-service's database (Lab 5, Grade 5: replication + failover). Three Patroni members
  # (player-postgres-1..3: one primary, a synchronous and a streaming standby) and, under the old
  # hostname player-postgres, an HAProxy that always forwards to the current primary. Lose the primary
  # and a standby is promoted within ~15 s; the services keep the same URL.
  player-postgres:
    <<: *postgres-ha-router
    environment:
      PG_MEMBER_1: player-postgres-1
      PG_MEMBER_2: player-postgres-2
      PG_MEMBER_3: player-postgres-3
    depends_on:
      player-postgres-1:
        condition: service_started
      player-postgres-2:
        condition: service_started
      player-postgres-3:
        condition: service_started

  player-postgres-1:
    <<: *postgres-ha-member
    environment:
      <<: *player-postgres-cluster
      PATRONI_NAME: player-postgres-1
      PATRONI_RESTAPI_CONNECT_ADDRESS: player-postgres-1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: player-postgres-1:5432
    volumes:
      - player-postgres-1-data:/var/lib/postgresql/patroni
      - ./docker/postgres-ha/patroni.yml:/etc/patroni/patroni.yml:ro

  player-postgres-2:
    <<: *postgres-ha-member
    environment:
      <<: *player-postgres-cluster
      PATRONI_NAME: player-postgres-2
      PATRONI_RESTAPI_CONNECT_ADDRESS: player-postgres-2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: player-postgres-2:5432
    volumes:
      - player-postgres-2-data:/var/lib/postgresql/patroni
      - ./docker/postgres-ha/patroni.yml:/etc/patroni/patroni.yml:ro

  player-postgres-3:
    <<: *postgres-ha-member
    environment:
      <<: *player-postgres-cluster
      PATRONI_NAME: player-postgres-3
      PATRONI_RESTAPI_CONNECT_ADDRESS: player-postgres-3:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: player-postgres-3:5432
    volumes:
      - player-postgres-3-data:/var/lib/postgresql/patroni
      - ./docker/postgres-ha/patroni.yml:/etc/patroni/patroni.yml:ro

  # Not published to the host: clients reach it only through the gateway (Lab 2). Its calls to
  # applicant-service and server-rules-service go through the gateway's internal port unless
  # SESSION_APPLICANT_CLIENT_MODE / SESSION_RULES_CLIENT_MODE=broker (Lab 4: through the broker, whose
  # circuit breakers then guard them; set broker once that service's image serves the gRPC
  # ServiceEndpoint, e.g. applicant with docker-compose.lab4-mihai.yml). session.started /
  # session.closed are published to the broker's topics (DMS_CLIENT_MODE=broker), decision.recorded
  # arrives from it on gRPC 9082 (private). No depends_on the gateway: the gateway depends on this
  # service, and the calls only happen once a request arrives. Every replica registers with
  # service-discovery under its container hostname and its own container address (Lab 3). All
  # replicas share session-postgres, which also carries the live updates between them
  # (LISTEN/NOTIFY), so an SSE stream open on one replica gets the changes made on any other.
  server-moderation-session-service:
    deploy:
      replicas: ${SESSION_REPLICAS:-2}
    image: drateeva/server-moderation-session-service:0.5.0
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://session-postgres:5432/sessiondb
      SPRING_DATASOURCE_USERNAME: ${SESSION_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${SESSION_POSTGRES_PASSWORD}
      GATEWAY_URL: http://gateway-service:8090
      APPLICANT_CLIENT_MODE: ${SESSION_APPLICANT_CLIENT_MODE:-http}
      RULES_CLIENT_MODE: ${SESSION_RULES_CLIENT_MODE:-http}
      DMS_CLIENT_MODE: broker
      MESSAGING_ENABLED: "true"
      MESSAGING_BROKER_ADDRESS: message-broker:9091
      SESSION_MAX_APPLICANTS_PER_SHIFT: ${SESSION_MAX_APPLICANTS_PER_SHIFT:-10}
      APPLICANT_DIFFICULTY: ${SESSION_APPLICANT_DIFFICULTY:-MEDIUM}
      SSE_MAX_CONNECTIONS: ${SESSION_SSE_MAX_CONNECTIONS:-100}
      SSE_TIMEOUT: ${SESSION_SSE_TIMEOUT:-30m}
      SSE_HEARTBEAT: ${SESSION_SSE_HEARTBEAT:-15s}
      TASK_TIMEOUT: ${SESSION_TASK_TIMEOUT:-10s}
      MAX_CONCURRENT_TASKS: ${SESSION_MAX_CONCURRENT_TASKS:-20}
      DISCOVERY_URL: http://service-discovery:8089
      # Lab 5, Grade 8: POST /sessions/{id}/close closes the shift in this database and credits it in
      # player-service's as one two-phase commit, coordinated by the message-broker
      # (contracts/two-phase.md). SESSION_SHIFT_CLOSE_MODE=event: the Lab 4 way (session.closed only).
      SHIFT_CLOSE_MODE: ${SESSION_SHIFT_CLOSE_MODE:-two-phase}
      TWO_PHASE_PARTICIPANT_ENABLED: "true"
      TWO_PHASE_COORDINATOR_URL: http://message-broker:8091
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      service-discovery:
        condition: service_healthy
      session-postgres:
        condition: service_healthy
      message-broker:
        condition: service_healthy

  # server-moderation-session-service's database, replicated like player-postgres. Its LISTEN/NOTIFY
  # (live updates between the session replicas) runs on the primary: after a failover the session
  # replicas reconnect through this HAProxy and resend each open stream its state.
  session-postgres:
    <<: *postgres-ha-router
    environment:
      PG_MEMBER_1: session-postgres-1
      PG_MEMBER_2: session-postgres-2
      PG_MEMBER_3: session-postgres-3
    depends_on:
      session-postgres-1:
        condition: service_started
      session-postgres-2:
        condition: service_started
      session-postgres-3:
        condition: service_started

  session-postgres-1:
    <<: *postgres-ha-member
    environment:
      <<: *session-postgres-cluster
      PATRONI_NAME: session-postgres-1
      PATRONI_RESTAPI_CONNECT_ADDRESS: session-postgres-1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: session-postgres-1:5432
    volumes:
      - session-postgres-1-data:/var/lib/postgresql/patroni
      - ./docker/postgres-ha/patroni.yml:/etc/patroni/patroni.yml:ro

  session-postgres-2:
    <<: *postgres-ha-member
    environment:
      <<: *session-postgres-cluster
      PATRONI_NAME: session-postgres-2
      PATRONI_RESTAPI_CONNECT_ADDRESS: session-postgres-2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: session-postgres-2:5432
    volumes:
      - session-postgres-2-data:/var/lib/postgresql/patroni
      - ./docker/postgres-ha/patroni.yml:/etc/patroni/patroni.yml:ro

  session-postgres-3:
    <<: *postgres-ha-member
    environment:
      <<: *session-postgres-cluster
      PATRONI_NAME: session-postgres-3
      PATRONI_RESTAPI_CONNECT_ADDRESS: session-postgres-3:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: session-postgres-3:5432
    volumes:
      - session-postgres-3-data:/var/lib/postgresql/patroni
      - ./docker/postgres-ha/patroni.yml:/etc/patroni/patroni.yml:ro

  # The consensus store of the replicated PostgreSQL clusters (player, session, record and
  # moderation; Lab 5, Grade 5): Patroni keeps each cluster's leader lock here, so exactly one member
  # of each is the primary. Three members, so it keeps working when one is lost. Private to this
  # Compose network.
  postgres-etcd-1:
    <<: *postgres-etcd
    command:
      - etcd
      - --name=postgres-etcd-1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://postgres-etcd-1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://postgres-etcd-1:2380
      - --initial-cluster=postgres-etcd-1=http://postgres-etcd-1:2380,postgres-etcd-2=http://postgres-etcd-2:2380,postgres-etcd-3=http://postgres-etcd-3:2380
      - --initial-cluster-token=team19-postgres
      - --initial-cluster-state=new
    volumes:
      - postgres-etcd-1-data:/etcd-data

  postgres-etcd-2:
    <<: *postgres-etcd
    command:
      - etcd
      - --name=postgres-etcd-2
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://postgres-etcd-2:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://postgres-etcd-2:2380
      - --initial-cluster=postgres-etcd-1=http://postgres-etcd-1:2380,postgres-etcd-2=http://postgres-etcd-2:2380,postgres-etcd-3=http://postgres-etcd-3:2380
      - --initial-cluster-token=team19-postgres
      - --initial-cluster-state=new
    volumes:
      - postgres-etcd-2-data:/etcd-data

  postgres-etcd-3:
    <<: *postgres-etcd
    command:
      - etcd
      - --name=postgres-etcd-3
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://postgres-etcd-3:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://postgres-etcd-3:2380
      - --initial-cluster=postgres-etcd-1=http://postgres-etcd-1:2380,postgres-etcd-2=http://postgres-etcd-2:2380,postgres-etcd-3=http://postgres-etcd-3:2380
      - --initial-cluster-token=team19-postgres
      - --initial-cluster-state=new
    volumes:
      - postgres-etcd-3-data:/etcd-data

  # Single entry point of the system (Lab 2). Clients call http://localhost:8080 with the paths from
  # the communication contract and an API key, and the gateway forwards each request to the service
  # that owns it without the Authorization header. Port 8090 is the internal port for the services'
  # calls to each other (no key needed): it is deliberately not published to the host.
  # Lab 5, Grade 9: also the coordinator of the decision-verdict saga (POST /sagas/decision-verdicts,
  # contracts/saga.md). It records each step in its own log on the gateway-data volume, retries a
  # step with backoff, compensates the completed steps when a later one fails, and after a restart
  # resumes the sagas that were still running.
  gateway-service:
    image: diana7376/gateway-service:0.6.0
    ports:
      - "8080:8080"
    environment:
      SD_URL: http://service-discovery:8089
      SD_POLL_INTERVAL_SECONDS: ${GATEWAY_SD_POLL_INTERVAL_SECONDS:-5}
      AUTH_API_KEYS: ${GATEWAY_API_KEYS}
      GATEWAY_INTERNAL_PORT: 8090
      WS_TICKET_SECRET: ${GATEWAY_WS_TICKET_SECRET}
      DMS_PUBLIC_WS_URL: ${DMS_PUBLIC_WS_URL:-ws://localhost:8088}
      PLAYER_SERVICE_URL: http://player-service:8081
      SESSION_SERVICE_URL: http://server-moderation-session-service:8082
      APPLICANT_SERVICE_URL: http://applicant-service:8083
      CREDENTIAL_SERVICE_URL: http://credential-service:8084
      RULES_SERVICE_URL: http://server-rules-service:8085
      RECORD_SERVICE_URL: http://university-record-service:8086
      MODERATION_SERVICE_URL: http://moderation-service:8087
      DMS_SERVICE_URL: http://discord-dms-service:8088
      REQUEST_TIMEOUT_SECONDS: ${GATEWAY_REQUEST_TIMEOUT_SECONDS:-10}
      MAX_CONCURRENT_REQUESTS: ${GATEWAY_MAX_CONCURRENT_REQUESTS:-200}
      BROKER_GRPC_URL: ${BROKER_GRPC_URL:-}
      # The saga coordinator (Lab 5, Grade 9). The step delay holds every step back, for
      # demonstrations only (0 = off): it leaves time to stop a participant in the middle of a saga.
      SAGA_ENABLED: "true"
      SAGA_LOG_PATH: /data/gateway-sagas.sqlite3
      SAGA_STEP_ATTEMPTS: ${GATEWAY_SAGA_STEP_ATTEMPTS:-3}
      SAGA_STEP_TIMEOUT_SECONDS: ${GATEWAY_SAGA_STEP_TIMEOUT_SECONDS:-5}
      SAGA_RETRY_BACKOFF_SECONDS: ${GATEWAY_SAGA_RETRY_BACKOFF_SECONDS:-1}
      SAGA_MAX_BACKOFF_SECONDS: ${GATEWAY_SAGA_MAX_BACKOFF_SECONDS:-30}
      SAGA_RECOVERY_INTERVAL_SECONDS: ${GATEWAY_SAGA_RECOVERY_INTERVAL_SECONDS:-5}
      SAGA_RESPONSE_TIMEOUT_SECONDS: ${GATEWAY_SAGA_RESPONSE_TIMEOUT_SECONDS:-8}
      SAGA_STEP_DELAY_SECONDS: ${GATEWAY_SAGA_STEP_DELAY_SECONDS:-0}
    volumes:
      - gateway-data:/data
    # The image has no curl, so the healthcheck uses Python, which it does have.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Started, not healthy: the gateway only connects to a service when a request for it arrives,
    # and answers 502 UPSTREAM_UNAVAILABLE while that service is still starting.
    depends_on:
      service-discovery:
        condition: service_healthy
      player-service:
        condition: service_started
      server-moderation-session-service:
        condition: service_started
      applicant-service:
        condition: service_started
      credential-service:
        condition: service_started
      server-rules-service:
        condition: service_started
      university-record-service:
        condition: service_started
      moderation-service:
        condition: service_started
      discord-dms-service:
        condition: service_started


  # Message Broker (Lab 4), private to this Compose network: HTTP 8091 (/health, /metrics, /topics),
  # gRPC 9091 (MessageBroker.Call, Publish, ListTopics). One instance: its topic queues are durable in SQLite.
  # It registers with service-discovery and finds each subscriber's instances (and their topics)
  # there, reaching an instance on its registered port + 1000.
  message-broker:
    image: drateeva/message-broker:0.5.0
    environment:
      BROKER_PORT: 8091
      BROKER_GRPC_PORT: 9091
      BROKER_MAX_THREADS: ${BROKER_MAX_THREADS:-32}
      DISCOVERY_URL: http://service-discovery:8089
      LOG_LEVEL: ${BROKER_LOG_LEVEL:-INFO}
      # Durable topic queues and the dead letter channel (Grade 9): one SQLite file on the named volume,
      # so queued events survive a restart, docker compose down and an image update.
      QUEUE_STORE_PATH: /data/broker.sqlite3
      # Lab 5, Grade 8: the two-phase commit coordinator keeps its decision log in the same file.
      # The delay holds phase 2 back after the decision, for demonstrations only (0 = off).
      TWO_PHASE_PHASE_TWO_DELAY_SECONDS: ${BROKER_TWO_PHASE_PHASE_TWO_DELAY_SECONDS:-0}
    volumes:
      - broker-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8091/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      service-discovery:
        condition: service_healthy

  # Control plane, private to this Compose network. One process: the registry is in memory.
  service-discovery:
    image: drateeva/service-discovery:0.5.0
    environment:
      DISCOVERY_PORT: 8089
      INSTANCE_TTL_SECONDS: ${DISCOVERY_INSTANCE_TTL_SECONDS:-30}
      POLL_INTERVAL_SECONDS: ${DISCOVERY_POLL_INTERVAL_SECONDS:-10}
      MAX_CONCURRENT_REQUESTS: ${DISCOVERY_MAX_CONCURRENT_REQUESTS:-200}
      REQUEST_TIMEOUT_SECONDS: ${DISCOVERY_REQUEST_TIMEOUT_SECONDS:-5}
      # Health alerts to the developers (Lab 3 Grade 9). An empty value switches that channel off;
      # with none set, the alerts are only logged.
      ALERT_DISCORD_WEBHOOK_URL: ${DISCOVERY_ALERT_DISCORD_WEBHOOK_URL:-}
      ALERT_TELEGRAM_BOT_TOKEN: ${DISCOVERY_ALERT_TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID: ${DISCOVERY_ALERT_TELEGRAM_CHAT_ID:-}
      ALERT_COOLDOWN_SECONDS: ${DISCOVERY_ALERT_COOLDOWN_SECONDS:-300}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8089/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Data Warehouse (Lab 5, Grade 4a): read-only target for the ETL job. Private to the Compose
  # network — no published port. The ETL container creates the star schema on first boot.
  warehouse-db:
    image: postgres:16
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: ${WAREHOUSE_DB_PASSWORD}
    volumes:
      - warehouse-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ETL job (Lab 5, Grade 4b): reads all 8 source databases on a schedule, transforms the data
  # into a star schema and loads it into warehouse-db idempotently (INSERT ... ON CONFLICT DO UPDATE).
  # Sources: player-postgres, session-postgres (Patroni HA), record-postgres (Patroni HA),
  # moderation-postgres (Patroni HA), rules-mongo (RS), applicant-redis, credential-redis, dms-redis
  # (Sentinel; the HAProxy at dms-redis leads to the current primary).
  etl:
    image: diana7376/pad-etl:0.6.0
    environment:
      WAREHOUSE_DB_URL: postgresql://warehouse:${WAREHOUSE_DB_PASSWORD}@warehouse-db:5432/warehouse
      PLAYER_POSTGRES_URL: postgresql://${PLAYER_POSTGRES_USER}:${PLAYER_POSTGRES_PASSWORD}@player-postgres:5432/playerdb
      SESSION_POSTGRES_URL: postgresql://${SESSION_POSTGRES_USER}:${SESSION_POSTGRES_PASSWORD}@session-postgres:5432/sessiondb
      MODERATION_POSTGRES_URL: postgresql://${MODERATION_POSTGRES_USER}:${MODERATION_POSTGRES_PASSWORD}@moderation-postgres:5432/moderation
      RECORD_POSTGRES_URL: postgresql://${RECORD_POSTGRES_USER}:${RECORD_POSTGRES_PASSWORD}@record-postgres:5432/university_record
      RULES_MONGO_URI: mongodb://${RULES_MONGO_USERNAME}:${RULES_MONGO_PASSWORD}@rules-mongo-1:27017,rules-mongo-2:27017,rules-mongo-3:27017/server_rules?authSource=admin&replicaSet=rs0
      APPLICANT_REDIS_URL: redis://:${APPLICANT_REDIS_PASSWORD}@applicant-redis:6379
