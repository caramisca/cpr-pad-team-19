global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: message-broker
    static_configs:
      - targets: ['message-broker:8091']
  - job_name: applicant-service
    dns_sd_configs:
      - names: ['applicant-service']
        type: A
        port: 8083
        refresh_interval: 5s
  - job_name: credential-service
    dns_sd_configs:
      - names: ['credential-service']
        type: A
        port: 8084
        refresh_interval: 5s
  - job_name: server-rules-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ['server-rules-service']
        type: A
        port: 8085
        refresh_interval: 5s
  - job_name: university-record-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ['university-record-service']
        type: A
        port: 8086
        refresh_interval: 5s
