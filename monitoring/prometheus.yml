global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: message-broker
    static_configs:
      - targets: ['message-broker:8091']
  - job_name: applicant-service
    dns_sd_configs:
      - names: ['applicant-service']
        type: A
        port: 8083
        refresh_interval: 5s
  - job_name: credential-service
    dns_sd_configs:
      - names: ['credential-service']
        type: A
        port: 8084
        refresh_interval: 5s
  - job_name: server-rules-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ['server-rules-service']
        type: A
        port: 8085
        refresh_interval: 5s
  - job_name: university-record-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ['university-record-service']
        type: A
        port: 8086
        refresh_interval: 5s
  # The remaining owners must expose these private metrics endpoints in their Lab 4 builds.
  # Failed scrapes remain DOWN; an absent DNS name can produce no targets at all.
  # Adding a scrape job is not runtime validation: use check_lab4_monitoring.py.
  - job_name: player-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ['player-service']
        type: A
        port: 8081
        refresh_interval: 5s
  - job_name: server-moderation-session-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ['server-moderation-session-service']
        type: A
        port: 8082
        refresh_interval: 5s
  - job_name: moderation-service
    dns_sd_configs:
      - names: ['moderation-service']
        type: A
        port: 8087
        refresh_interval: 5s
  - job_name: discord-dms-service
    dns_sd_configs:
      - names: ['discord-dms-service', 'discord-dms-service-replica']
        type: A
        port: 8088
        refresh_interval: 5s
