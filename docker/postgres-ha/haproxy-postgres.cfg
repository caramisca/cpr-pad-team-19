# The stable address of a replicated PostgreSQL cluster (Lab 5, Grade 5). The services connect to
# this HAProxy under the cluster's old hostname (player-postgres, session-postgres) and it forwards
# each connection to the member that is the primary right now, as Patroni's REST API reports it
# (GET /primary answers 200 only on the primary). After a failover the new primary turns healthy within
# a few seconds, and the connections still open to the old one are closed, so the services' pools
# reconnect to the new primary. Members: PG_MEMBER_1..3, set in Compose.

global
    maxconn 300

# Docker's DNS: a member that restarts may come back with another IP address. A member that is
# killed disappears from DNS at once; holding its last address for 30 s lets the health check mark it
# DOWN first (which closes its connections, below) instead of HAProxy parking it in maintenance with
# connections still assigned to it.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold nx 30s
    hold obsolete 30s

defaults
    mode tcp
    # A connection that can't reach its member is retried, on another member if need be, and one that
    # finds no primary at all is refused after 5 s instead of waiting: the service's pool then answers
    # its request 503 DATABASE_UNAVAILABLE and tries again on the next one.
    option redispatch
    retries 2
    timeout queue 5s
    timeout connect 3s
    # Connections stay open in the services' pools, and session's LISTEN connection waits for
    # notifications, so idle connections must not be cut.
    timeout client 30m
    timeout server 30m
    timeout check 2s

# GET /healthz answers 200 only while a primary is reachable: the Compose healthcheck, so the services
# start only once their database can take writes. GET /stats shows which member is the primary.
frontend status
    mode http
    bind *:8404
    monitor-uri /healthz
    monitor fail if { nbsrv(primary) lt 1 }
    stats enable
    stats uri /stats
    stats refresh 5s

listen primary
    bind *:5432
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 1s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none
    server member-1 "${PG_MEMBER_1}:5432" check port 8008
    server member-2 "${PG_MEMBER_2}:5432" check port 8008
    server member-3 "${PG_MEMBER_3}:5432" check port 8008
