# The stable address of a replicated Redis (Lab 5, Grade 5), under its old hostname (dms-redis). The
# service itself asks the Sentinels for the primary; this router is for clients that only know one
# address (the ETL job reads dms-redis:6379). It forwards each connection to the member that reports
# role:master right now. After a failover the promoted replica turns healthy within a few seconds,
# and the connections still open to the old primary are closed. Members: REDIS_MEMBER_1..3 and the
# password REDIS_PASSWORD, set in Compose (environment only, never in this file).

global
    maxconn 300

# Docker's DNS, as in haproxy-postgres.cfg: a member that restarts may come back with another IP
# address, and one that is killed disappears from DNS at once.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold nx 30s
    hold obsolete 30s

defaults
    mode tcp
    option redispatch
    retries 2
    timeout queue 5s
    timeout connect 3s
    timeout client 30m
    timeout server 30m
    timeout check 2s

# GET /healthz answers 200 only while one member is the primary: the Compose healthcheck.
# GET /stats shows which member it is.
frontend status
    mode http
    bind *:8404
    monitor-uri /healthz
    monitor fail if { nbsrv(primary) lt 1 }
    stats enable
    stats uri /stats
    stats refresh 5s

listen primary
    bind *:6379
    # Normally exactly one member passes the check. Should two report role:master for a moment (an old
    # primary that came back before the Sentinels turned it into a replica), "first" still sends every
    # connection to the same member instead of splitting the writes between two primaries.
    balance first
    option tcp-check
    tcp-check connect
    tcp-check send "AUTH ${REDIS_PASSWORD}\r\n"
    tcp-check expect string +OK
    tcp-check send "INFO replication\r\n"
    tcp-check expect string role:master
    tcp-check send "QUIT\r\n"
    tcp-check expect string +OK
    default-server inter 1s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none
    server member-1 "${REDIS_MEMBER_1}:6379" check
    server member-2 "${REDIS_MEMBER_2}:6379" check
    server member-3 "${REDIS_MEMBER_3}:6379" check
